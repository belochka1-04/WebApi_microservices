version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - microservices

  webapi_applications:
    build: ./WebApi_Applications
    container_name: webapi_applications
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_documentservice:
    build: ./WebApi_document
    container_name: webapi_documentservice
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_errorlogservice:
    build: ./WebApi_ErrorLogService
    container_name: webapi_errorlogservice
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_imageservice:
    build: ./WebApi_ImageJobService
    container_name: webapi_imagejobservice
    ports:
      - "5005:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_jobdocumentservice:
    build: ./WebApi_JobDocumentService
    container_name: webapi_jobdocumentservice
    ports:
      - "5006:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_jobs:
    build: ./WebApi_jobs
    container_name: webapi_jobs
    ports:
      - "5007:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_jobservice:
    build: ./WebApi_JobService
    container_name: webapi_jobservice
    ports:
      - "5008:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_jobstockservice:
    build: ./WebApi_JobStockService
    container_name: webapi_jobstockservice
    ports:
      - "5009:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_maskservice:
    build: ./WebApi_MaskService
    container_name: webapi_maskservice
    ports:
      - "5010:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=guest
      - RabbitMQ__Password=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices

  webapi_modelnumberservice:
    build: ./WebApi_ModelNumberService
    container_name: webapi_modelnumberservice
    ports:
      - "5011:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_modelservice:
    build: ./WebApi_ModelService
    container_name: webapi_modelservice
    ports:
      - "5012:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_partserviceservice:
    build: ./WebApi_PartSourceService
    container_name: webapi_partsourceservice
    ports:
      - "5013:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_partspicarchiveservice:
    build: ./WebApi_PartsPicArchiveService
    container_name: webapi_partspicarchiveservice
