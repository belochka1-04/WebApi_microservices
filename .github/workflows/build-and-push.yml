name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: ApplicationService
            image: applicationservice
          - folder: JobService
            image: jobservice
          - folder: ModelNumberService
            image: modelnumberservice
          - folder: MaskService
            image: maskservice
          - folder: PartSourceService
            image: partsourceservice
          - folder: DocumentService
            image: documentservice
          - folder: ErrorLogService
            image: errorlogservice
          - folder: ImageJobService
            image: imagejobservice
          - folder: JobDocumentService
            image: jobdocumentservice
          - folder: JobStockService
            image: jobstockservice
          - folder: ModelService
            image: modelservice
          - folder: PartsPicArchiveService
            image: partspicarchiveservice
          - folder: PartsService
            image: partsservice
          - folder: PriceBotTasksService
            image: pricebottasksservice
          - folder: ProxyService
            image: proxyservice
          - folder: ReplacesArchiveService
            image: replacesarchiveservice
          - folder: ResponsesService
            image: responsesservice
          - folder: SourceService
            image: sourceservice
          - folder: StockCredsService
            image: stockcredsservice
          - folder: StopWordsService
            image: stopwordsservice
          - folder: UniqModelService
            image: uniqmodelservice
          - folder: UserService
            image: userservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.folder }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WebApi_${{ matrix.folder }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:buildcache,mode=max
