name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - applicationservice
          - jobservice
          - modelnumberservice
          - maskservice
          - partsourceservice
          - documentservice
          - errorlogservice
          - imagejobservice
          - jobdocumentservice
          - jobstockservice
          - modelservice
          - partspicarchiveservice
          - partsservice
          - pricebottasksservice
          - proxyservice
          - replacesarchiveservice
          - responsesservice
          - sourceservice
          - stockcredsservice
          - stopwordsservice
          - uniqmodelservice
          - userservice

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WebApi_${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache,mode=max
