name: CI/CD for WebApi_ApplicationService

on:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__KameraDb: ${{ secrets.MSSQL_CONNECTION_STRING }}
      Authentication__SecretKey: ${{ secrets.AUTH_SECRET_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./WebApi_applications/WebApi_applications.csproj

      - name: Build
        run: dotnet build ./WebApi_applications/WebApi_applications.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./WebApi_applications/WebApi_applications.csproj --configuration Release --no-build

  build-windows:
    needs: build-test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Windows Docker image
        run: docker build -f Dockerfile.windows -t myrepo/webapi_applications:windows-${{ github.sha }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Windows image
        run: docker push myrepo/webapi_applications:windows-${{ github.sha }}

  deploy-windows:
    needs: build-windows
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Windows server
        run: |
          $username = "${{ secrets.WINDOWS_SERVER_USER }}"
          $password = ConvertTo-SecureString "${{ secrets.WINDOWS_SERVER_PASSWORD }}" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($username, $password)
          $session = New-PSSession -ComputerName ${{ secrets.WINDOWS_SERVER_IP }} -Credential $credential
          Invoke-Command -Session $session -ScriptBlock {
            docker pull myrepo/webapi_applications:windows-${{ github.sha }}
            docker stop webapi_applications || true
            docker rm webapi_applications || true
            docker run -d --name webapi_applications -p 6050:6050 myrepo/webapi_applications:windows-${{ github.sha }}
          }
          Remove-PSSession $session
