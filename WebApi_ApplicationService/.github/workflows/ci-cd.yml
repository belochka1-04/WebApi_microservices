name: CI/CD for WebApi_ApplicationService

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.MSSQL_CONNECTION_STRING }}
      Authentication__SecretKey: ${{ secrets.AUTH_SECRET_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./WebApi_applications/WebApi_applications.csproj

      - name: Build
        run: dotnet build ./WebApi_applications/WebApi_applications.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./WebApi_applications/WebApi_applications.csproj --configuration Release --no-build

      - name: Build Docker image
        run: docker build -t myrepo/webapi_applications:${{ github.sha }} ./WebApi_applications

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push myrepo/webapi_applications:${{ github.sha }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Kubernetes or server
        run: |
          # Здесь команда деплоя из Docker Registry на продакшн или тестовый кластер
          echo "Deploying image myrepo/webapi_applications:${{ github.sha }}"
          # Пример: kubectl set image deployment/webapi webapi=myrepo/webapi_applications:${{ github.sha }}
