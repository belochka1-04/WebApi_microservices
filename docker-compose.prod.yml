version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - microservices
    restart: unless-stopped

  applicationservice:
    image: belochka104/applicationservice:latest
    container_name: applicationservice
    ports:
      - "5001:80"
    env_file:
      - .env.prod
    networks:
      - microservices
    restart: unless-stopped

  jobservice:
    image: belochka104/jobservice:latest
    container_name: jobservice
    ports:
