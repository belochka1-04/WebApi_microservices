      - "5017:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_replacesarchiveservice:
    build: ./WebApi_ReplacesArchiveService
    container_name: webapi_replacesarchiveservice
    ports:
      - "5018:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservices

  webapi_responsesservice:
    build: ./WebApi_ResponsesService
    container_name: webapi_responsesservice
    ports:
      - "5019:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
